[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upframe"
version = "1.0.0"
description = "Production-Grade Video Upframing Pipeline for Football Broadcast Video"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "numpy",
    "pyyaml",
    "tqdm",
    "opencv-python-headless",
]

[project.scripts]
upframe = "upframe.cli.upframe:main"
